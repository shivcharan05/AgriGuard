<!DOCTYPE html>
<html>

<head>

<title>Dashboard</title>


<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>

  <!-- Navbar at top -->
  <div id="navbar"></div>

  <!-- Main layout: sidebar LEFT + content RIGHT -->
  <div class="layout-wrapper">
    <div id="sidebar"></div>

    <div class="main-content">

      <div class="container">

        <h2 class="dashboard-title" data-i18n="dashboard.title">Dashboard</h2>

        <!-- TOTAL ANIMALS -->
        <div class="card">
          <h3 data-i18n="dashboard.totalAnimals">Total Animals</h3>
          <p id="animalCount">0</p>
        </div>

        <!-- ACTION CARDS -->
        <div class="card-container">

          <div class="card">
            <h3 data-i18n="dashboard.totalAnimals">Total Animals</h3>
            <p data-i18n="dashboard.manageAnimals">Manage your animals</p>
            <button onclick="goToAnimals()" data-i18n="dashboard.view">View</button>
          </div>

          <div class="card">
            <h3 data-i18n="dashboard.diseaseDetection">Disease Detection</h3>
            <p data-i18n="dashboard.uploadImage">Upload image to detect disease</p>
            <button
              onclick="location.href='pages/disease-detection.html'"
              data-i18n="dashboard.check">
              Check
            </button>
          </div>

          <div class="card">
            <h3 data-i18n="dashboard.vaccination">Vaccination</h3>
            <p data-i18n="dashboard.trackVaccination">Track vaccination schedule</p>
            <button onclick="goToVaccination()" data-i18n="dashboard.open">Open</button>
          </div>

          <div class="card">
            <h3 data-i18n="dashboard.outbreakMap">Outbreak Map</h3>
            <p data-i18n="dashboard.seeOutbreaks">See disease outbreaks</p>
            <button onclick="goToMap()" data-i18n="dashboard.viewMap">View Map</button>
          </div>

        </div>

        <!-- CHARTS -->
        <div class="charts-container">

          <div class="chart-box">
            <h3 data-i18n="dashboard.animalDistribution">Animal Distribution</h3>
            <canvas id="animalChart"></canvas>
          </div>

          <div class="chart-box">
            <h3 data-i18n="dashboard.diseaseCases">Disease Cases</h3>
            <canvas id="diseaseChart"></canvas>
          </div>

          <div class="chart-box">
            <h3 data-i18n="dashboard.vaccinationCoverage">Vaccination Coverage</h3>
            <canvas id="vaccineChart"></canvas>
          </div>

        </div>

        <!-- ALERT -->
        <div id="alertBox"></div>

      </div>

    </div>
  </div>

  <!-- Footer at bottom -->
  <div id="footer"></div>

  <!-- ===== SCRIPTS ===== -->
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script src="js/dashboard.js"></script>
  <!-- =================== -->

</body>
</html>
